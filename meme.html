<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meme Match</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #eef5f3;
      --text: #16181d;
      --muted: #5f6672;
      --line: #d8dde4;
      --accent: #0f766e;
      --accent-dark: #0b5f59;
      --accent-soft: #d9f2ee;
      --danger: #9f2f2f;
      --danger-soft: #fde8e8;
      --shadow: 0 20px 55px rgba(22, 24, 29, 0.11);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.12), transparent 34rem),
        linear-gradient(315deg, rgba(194, 119, 58, 0.13), transparent 30rem),
        var(--bg);
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 4px solid rgba(15, 118, 110, 0.28);
      outline-offset: 4px;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .shell {
      display: grid;
      gap: 24px;
    }

    .hero {
      display: grid;
      gap: 12px;
      max-width: 760px;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 84px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .intro {
      max-width: 660px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
    }

    .game {
      display: grid;
      gap: 22px;
      padding: clamp(18px, 3vw, 30px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
    }

    .caption-card {
      display: grid;
      gap: 8px;
      padding: clamp(18px, 3vw, 26px);
      border: 1px solid rgba(15, 118, 110, 0.2);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .caption-label {
      margin: 0;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .caption {
      min-height: 2.8em;
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 800;
      line-height: 1.16;
      overflow-wrap: break-word;
    }

    .status {
      min-height: 1.6em;
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .choice {
      display: grid;
      gap: 12px;
      width: 100%;
      min-height: 100%;
      padding: 12px;
      border: 2px solid transparent;
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 10px 24px rgba(22, 24, 29, 0.08);
      cursor: pointer;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      text-align: left;
    }

    .choice:hover:not(:disabled) {
      border-color: rgba(15, 118, 110, 0.4);
      box-shadow: 0 16px 32px rgba(22, 24, 29, 0.13);
      transform: translateY(-2px);
    }

    .choice:disabled {
      cursor: default;
    }

    .choice.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 18px 36px rgba(15, 118, 110, 0.18);
    }

    .image-frame {
      display: grid;
      aspect-ratio: 4 / 3;
      place-items: center;
      overflow: hidden;
      border-radius: 6px;
      background: #e7ebef;
    }

    .image-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .choice-name {
      min-height: 2.7em;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .primary-button,
    .secondary-button {
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-button {
      border: 1px solid var(--accent-dark);
      background: var(--accent);
      color: #ffffff;
    }

    .primary-button:hover {
      background: var(--accent-dark);
    }

    .secondary-button {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
    }

    .secondary-button:hover {
      border-color: var(--accent);
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 18px;
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--muted);
      font-weight: 700;
    }

    .message.error {
      border: 1px solid rgba(159, 47, 47, 0.28);
      background: var(--danger-soft);
      color: var(--danger);
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 24px, 1120px);
        padding-top: 22px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .choice {
        padding: 10px;
      }

      .choice-name {
        min-height: auto;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      .action-buttons {
        flex-direction: column;
      }

      .primary-button,
      .secondary-button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="shell">
      <header class="hero">
        <p class="eyebrow">Pick the funniest fit</p>
        <h1>Meme Match</h1>
        <p class="intro">
          Match a caption with one of three raw meme templates. No generated captions, no overlays, just instinct.
        </p>
      </header>

      <section class="game" aria-label="Meme Match game">
        <div id="loadingState" class="message" aria-live="polite">Loading meme templates...</div>

        <div id="errorState" class="message error hidden" aria-live="polite">
          <p id="errorMessage">Could not load meme templates.</p>
          <button id="retryButton" class="secondary-button" type="button">Retry</button>
        </div>

        <div id="gameBoard" class="hidden">
          <div class="caption-card">
            <p class="caption-label">Caption card</p>
            <p id="captionText" class="caption"></p>
          </div>

          <p id="statusText" class="status" aria-live="polite"></p>

          <div id="choices" class="choices" aria-label="Meme template choices"></div>

          <div class="actions">
            <p id="resultText" class="status" aria-live="polite"></p>
            <div class="action-buttons">
              <button id="rerollButton" class="secondary-button" type="button">New pictures</button>
              <button id="nextButton" class="primary-button hidden" type="button">Next round</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

    function setView(view) {
      loadingState.classList.toggle("hidden", view !== "loading");
      errorState.classList.toggle("hidden", view !== "error");
      gameBoard.classList.toggle("hidden", view !== "game");
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function templateKey(template) {
      return template.id || template.url;
    }

    function pickUniqueTemplates(count, excludedKeys = new Set()) {
      const pool = memeTemplates.filter((template) => !excludedKeys.has(templateKey(template)));
      const selected = [];

      while (selected.length < count && pool.length > 0) {
        const index = Math.floor(Math.random() * pool.length);
        selected.push(pool.splice(index, 1)[0]);
      }

      return selected;
    }

    function renderChoices(excludedKeys) {
      currentRound = pickUniqueTemplates(3, excludedKeys);

      if (currentRound.length !== 3) {
        showError("Imgflip did not return enough meme templates to start a round.");
        return;
      }

      choices.innerHTML = "";

      currentRound.forEach((template, index) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.type = "button";
        button.setAttribute("aria-label", `Choose meme template: ${template.name}`);

        const frame = document.createElement("span");
        frame.className = "image-frame";

        const image = document.createElement("img");
        image.src = template.url;
        image.alt = `Meme template: ${template.name}`;
        image.loading = index === 0 ? "eager" : "lazy";

        const name = document.createElement("span");
        name.className = "choice-name";
        name.textContent = `Choice ${index + 1}`;

        frame.appendChild(image);
        button.append(frame, name);
        button.addEventListener("click", () => selectTemplate(button, template));
        choices.appendChild(button);
      });

      setView("game");
    }

    function startRound() {
      rerollUsed = false;
      captionText.textContent = randomItem(captions);
      statusText.textContent = "Choose the meme template that makes this caption funniest. You can change your pick before the next round.";
      resultText.textContent = "";
      rerollButton.disabled = false;
      rerollButton.textContent = "New pictures";
      nextButton.classList.add("hidden");
      renderChoices();
    }

    function rerollPictures() {
      if (rerollUsed) {
        return;
      }

      const previousRoundKeys = new Set(currentRound.map(templateKey));
      rerollUsed = true;
      resultText.textContent = "";
      rerollButton.disabled = true;
      rerollButton.textContent = "Pictures changed";
      nextButton.classList.add("hidden");
      statusText.textContent = "New pictures loaded for this caption. This round's picture swap has been used.";
      renderChoices(previousRoundKeys);
    }

    function selectTemplate(selectedButton, template) {
      const choiceButtons = choices.querySelectorAll(".choice");

      choiceButtons.forEach((button) => {
        button.classList.toggle("selected", button === selectedButton);
      });

      statusText.textContent = "Selection saved. Pick another image if you want to change it.";
      resultText.textContent = `You picked: ${template.name}`;
      nextButton.classList.remove("hidden");
      nextButton.focus();
    }

    function showError(message) {
      errorMessage.textContent = message;
      setView("error");
    }

    async function loadMemes() {
      setView("loading");
      statusText.textContent = "";
      resultText.textContent = "";

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(`Imgflip returned HTTP ${response.status}.`);
        }

        const payload = await response.json();
        const templates = payload && payload.data && Array.isArray(payload.data.memes)
          ? payload.data.memes
          : [];

        const seenTemplates = new Set();
        memeTemplates = templates.filter((template) => {
          if (!template || !template.name || !template.url) {
            return false;
          }

          const key = template.id || template.url;
          if (seenTemplates.has(key)) {
            return false;
          }

          seenTemplates.add(key);
          return true;
        });

        if (!payload.success || memeTemplates.length < 3) {
          throw new Error("Imgflip returned an unusable meme list.");
        }

        startRound();
      } catch (error) {
        showError(error.message || "Could not load meme templates.");
      }
    }

    retryButton.addEventListener("click", loadMemes);
    rerollButton.addEventListener("click", rerollPictures);
    nextButton.addEventListener("click", startRound);

    loadMemes();
  </script>
</body>
</html>
